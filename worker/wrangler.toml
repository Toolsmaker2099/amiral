name = "amiral-server"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "TTT"
class_name = "TttRoom"

[[durable_objects.bindings]]
name = "PLAY"
class_name = "PlayRoom"

# Durable Objects stockés en SQLite : disponibles sur l'offre gratuite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TttRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PlayRoom"]
